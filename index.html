<!doctype html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <!-- Instant Synchronous Theme & Icon Initializer to Prevent FOUC (Flash of Unstyled Content) -->
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('epitotudas_site_settings_v1') || 
                  localStorage.getItem('epitotudas_site_settings_backup_v1') ||
                  sessionStorage.getItem('epitotudas_site_settings_v1');
        var s = raw ? JSON.parse(raw) : null;
        var root = document.documentElement;
        var accent = (s && s.primaryColor) || '#4165b4';
        var adminAccent = (s && s.adminAccentColor) || '#3B82F6';
        var adminBg = (s && s.adminBgColor) || '#423f3e';
        var adminCardBg = (s && s.adminCardBgColor) || '#2b2e36';
        var adminCardHighlight = (s && (s.adminCardHighlightColor || s.adminAccentColor)) || '#EC4899';

        root.style.setProperty('--color-accent', accent);
        root.style.setProperty('--color-admin-accent', adminAccent);
        root.style.setProperty('--color-admin-bg', adminBg);
        root.style.setProperty('--color-admin-card-bg', adminCardBg);
        root.style.setProperty('--color-admin-card-border', adminCardBg);
        root.style.setProperty('--color-admin-card-highlight', adminCardHighlight);
        root.style.setProperty('--color-admin-card-highlight-bg', adminCardHighlight + '1C');

          if (s.siteTitle) {
            document.title = s.siteTitle + ' - ' + (s.tagline || 'Építőipari Tudásbázis & Szakmai Enciklopédia');
          }

          var v = s.iconsUpdatedAt || Date.now();
          var appendV = function(u) {
            if (!u) return '';
            if (u.indexOf('data:') === 0) return u;
            return u.indexOf('?') !== -1 ? u + '&v=' + v : u + '?v=' + v;
          };

          var effectiveLogo = (s.logoUrl && s.logoUrl !== '/logo.png') ? s.logoUrl : '/logo.png';
          var effectiveIco = (s.faviconIcoUrl && s.faviconIcoUrl !== '/favicon.ico') ? s.faviconIcoUrl : effectiveLogo;
          var effectivePng = (s.faviconPngUrl && s.faviconPngUrl !== '/logo.png') ? s.faviconPngUrl : effectiveLogo;
          var effectiveApple = (s.appleTouchIconUrl && s.appleTouchIconUrl !== '/logo.png') ? s.appleTouchIconUrl : effectiveLogo;

          var icoUrl = appendV(effectiveIco);
          var pngUrl = appendV(effectivePng);
          var appleUrl = appendV(effectiveApple);

          var elIco = document.getElementById('app-favicon-ico');
          if (elIco) elIco.href = icoUrl;
          var elPng = document.getElementById('app-favicon-png');
          if (elPng) elPng.href = pngUrl;
          var elShortcut = document.getElementById('app-favicon-shortcut');
          if (elShortcut) elShortcut.href = pngUrl;
          var elApple = document.getElementById('app-apple-touch-icon');
          if (elApple) elApple.href = appleUrl;

          window.__INITIAL_SITE_SETTINGS__ = s;
        }
      } catch (e) {}
    })();
  </script>

  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1" id="app-favicon-ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/logo.png?v=1" id="app-favicon-png" />
  <link rel="shortcut icon" href="/logo.png?v=1" id="app-favicon-shortcut" />
  <link rel="apple-touch-icon" href="/logo.png?v=1" id="app-apple-touch-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>ÉpítőTudás – Építőipari tudásbázis és szakmai képzések</title>
  <meta name="description" content="Építőipari tudásbázis szakembereknek, tanulóknak és kivitelezőknek. Szakmai fogalmak, technológiák, szakmák, számítások és gyakorlati tudás egy helyen." />
  <link rel="canonical" href="https://epitotudas.hu" />

  <!-- Open Graph / Facebook -->
  <meta property="og:site_name" content="ÉpítőTudás" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://epitotudas.hu" />
  <meta property="og:title" content="ÉpítőTudás – Építőipari tudásbázis és szakmai képzések" />
  <meta property="og:description" content="Építőipari tudásbázis szakembereknek, tanulóknak és kivitelezőknek. Szakmai fogalmak, technológiák, szakmák, számítások és gyakorlati tudás egy helyen." />
  <meta property="og:image" content="https://epitotudas.hu/logo.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ÉpítőTudás – Építőipari tudásbázis és szakmai képzések" />
  <meta name="twitter:description" content="Építőipari tudásbázis szakembereknek, tanulóknak és kivitelezőknek. Szakmai fogalmak, technológiák, szakmák, számítások és gyakorlati tudás egy helyen." />
  <meta name="twitter:image" content="https://epitotudas.hu/logo.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
