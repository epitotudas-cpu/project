<!doctype html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <!-- Instant Synchronous Theme & Icon Initializer to Prevent FOUC (Flash of Unstyled Content) -->
  <script>
    (function() {
      try {
        if (window.location.hostname === 'epitotudas.hu') {
          window.location.replace('https://www.epitotudas.hu' + window.location.pathname + window.location.search + window.location.hash);
          return;
        }
      } catch (err) {}
      try {
        var raw = localStorage.getItem('epitotudas_site_settings_v1') || 
                  localStorage.getItem('epitotudas_site_settings_backup_v1') ||
                  sessionStorage.getItem('epitotudas_site_settings_v1');
        var s = raw ? JSON.parse(raw) : null;
        var root = document.documentElement;
        var accent = (s && s.primaryColor) || '#4165b4';
        var adminAccent = (s && s.adminAccentColor) || '#3B82F6';
        var adminBg = (s && s.adminBgColor) || '#423f3e';
        var adminCardBg = (s && s.adminCardBgColor) || '#2b2e36';
        var adminCardHighlight = (s && (s.adminCardHighlightColor || s.adminAccentColor)) || '#EC4899';

        root.style.setProperty('--color-accent', accent);
        root.style.setProperty('--color-admin-accent', adminAccent);
        root.style.setProperty('--color-admin-bg', adminBg);
        root.style.setProperty('--color-admin-card-bg', adminCardBg);
        root.style.setProperty('--color-admin-card-border', adminCardBg);
        root.style.setProperty('--color-admin-card-highlight', adminCardHighlight);
        root.style.setProperty('--color-admin-card-highlight-bg', adminCardHighlight + '1C');

        if (s && s.siteTitle) {
          document.title = s.siteTitle + ' - ' + (s.tagline || 'Építőipari Tudásbázis & Szakmai Enciklopédia');
        }

        if (s) {
          var v = s.iconsUpdatedAt || '20260910_v2';
          var appendV = function(u) {
            if (!u) return '';
            if (u.indexOf('data:') === 0) return u;
            return u.indexOf('?') !== -1 ? u + '&v=' + v : u + '?v=' + v;
          };

          var effectiveLogo = (s.logoUrl && s.logoUrl !== '/logo.png') ? s.logoUrl : '/site-tile.png';
          var effectiveIco = (s.faviconIcoUrl && s.faviconIcoUrl !== '/favicon.ico') ? s.faviconIcoUrl : '/favicon.ico';
          var effectivePng16 = (s.faviconPngUrl && s.faviconPngUrl !== '/logo.png') ? s.faviconPngUrl : '/favicon-16x16.png';
          var effectivePng32 = (s.faviconPngUrl && s.faviconPngUrl !== '/logo.png') ? s.faviconPngUrl : '/favicon-32x32.png';
          var effectiveApple = (s.appleTouchIconUrl && s.appleTouchIconUrl !== '/logo.png') ? s.appleTouchIconUrl : '/apple-touch-icon.png';
          var effectivePwa192 = (s.pwaIcon192Url && s.pwaIcon192Url !== '/logo.png') ? s.pwaIcon192Url : '/android-chrome-192x192.png';
          var effectivePwa512 = (s.pwaIcon512Url && s.pwaIcon512Url !== '/logo.png') ? s.pwaIcon512Url : '/android-chrome-512x512.png';

          var icoUrl = appendV(effectiveIco);
          var png16Url = appendV(effectivePng16);
          var png32Url = appendV(effectivePng32);
          var appleUrl = appendV(effectiveApple);
          var pwa192Url = appendV(effectivePwa192);
          var pwa512Url = appendV(effectivePwa512);

          var elIco = document.getElementById('app-favicon-ico');
          if (elIco) elIco.href = icoUrl;
          var el16 = document.getElementById('app-favicon-16');
          if (el16) el16.href = png16Url;
          var elPng = document.getElementById('app-favicon-png');
          if (elPng) elPng.href = png32Url;
          var elShortcut = document.getElementById('app-favicon-shortcut');
          if (elShortcut) elShortcut.href = png32Url;
          var elImageSrc = document.getElementById('app-image-src');
          if (elImageSrc) elImageSrc.href = appendV(effectiveLogo);
          var elApple = document.getElementById('app-apple-touch-icon');
          if (elApple) elApple.href = appleUrl;
          var elApplePre = document.getElementById('app-apple-touch-precomposed');
          if (elApplePre) elApplePre.href = appleUrl;
          var elPwa192 = document.getElementById('app-pwa-192');
          if (elPwa192) elPwa192.href = pwa192Url;
          var elPwa512 = document.getElementById('app-pwa-512');
          if (elPwa512) elPwa512.href = pwa512Url;

          window.__INITIAL_SITE_SETTINGS__ = s;
        }
      } catch (e) {}

      // Cache Storage purge & Service Worker registration
      try {
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) {
              if (key !== 'epitotudas-v4') {
                caches.delete(key);
              }
            });
          });
        }
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              reg.update();
            }).catch(function() {});
          });
        }
      } catch (e) {}

      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__DEFERRED_PWA_PROMPT__ = e;
      });
    })();
  </script>
